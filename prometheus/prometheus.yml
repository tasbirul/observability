global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: ec2-2-node
    static_configs:
      - targets:
          - 10.40.1.161:9100

  - job_name: ec2-1-node
    static_configs:
      - targets:
          - 10.40.1.111:9100
