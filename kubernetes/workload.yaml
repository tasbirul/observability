apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: observability-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                echo "{\"level\":\"info\",\"app\":\"log-generator\",\"message\":\"processed event\",\"sequence\":${i}}"
                if [ $((i % 7)) -eq 0 ]; then
                  echo "{\"level\":\"error\",\"app\":\"log-generator\",\"message\":\"simulated processing failure\",\"sequence\":${i}}" >&2
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
